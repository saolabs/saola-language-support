<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Saola Template</title>
  <defs>
    <!-- Sừng sẫm màu để nổi bật trên nền sáng -->
    <linearGradient id="sao-l-horn-f" x1="14" y1="12" x2="4" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="sao-l-horn-b" x1="16.5" y1="11" x2="8" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- Trán & sống mũi: đỏ son tương phản mạnh trên nền trắng -->
    <linearGradient id="sao-l-face" x1="13" y1="12" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>

  <!-- Sừng sau -->
  <polygon points="16,11 17.5,11.5 9,2 7.5,2.3" fill="url(#sao-l-horn-b)"/>

  <!-- Sừng trước -->
  <polygon points="13.2,12.5 15.2,13 4.8,2 3.5,2.5" fill="url(#sao-l-horn-f)"/>

  <!-- Tai vuốt nghiêng ra sau -->
  <polygon points="12,14.8 4.5,17 5.5,18.8 11.8,17.2" fill="#B71C1C"/>
  <polygon points="11,15.5 6.5,17.2 9.8,17" fill="#EF5350"/>

  <!-- Mặt trên: Trán & sống mũi -->
  <polygon points="13.2,12.5 18,14 27.5,20.5 23.5,22.5 16.5,18" fill="url(#sao-l-face)"/>

  <!-- Mặt giữa & Gò má -->
  <polygon points="16.5,18 23.5,22.5 27,21.5 21,24.5 15.5,20.5" fill="#C62828"/>

  <!-- Cằm & Mõm nhọn gọn -->
  <polygon points="27.5,20.5 27,21.5 25.5,23.5 21,24.5 23.5,22.5" fill="#B71C1C"/>

  <!-- Cổ & Gáy -->
  <polygon points="11.8,16.5 16.5,18 15.5,20.5 16.5,27.5 11.5,28.8 9.5,23.5" fill="#991B1B"/>

  <!-- Họng & Ức -->
  <polygon points="15.5,20.5 21,24.5 16.5,27.5" fill="#7F1D1D"/>

  <!-- Mắt Sao la -->
  <polygon points="19.2,16.2 20.8,17 19.6,17.6 18.2,17" fill="#111827"/>

  <!-- Vệt trắng đặc trưng má & sống mũi Sao la -->
  <polygon points="18.5,18.5 23,21.2 22.3,22 17.8,19.3" fill="#FFFFFF"/>
  <polygon points="16.2,20.2 20.2,23 19.5,23.8 15.5,21" fill="#FFFFFF"/>
  <polygon points="20.5,15.5 22.5,17 21.8,17.5 19.8,16" fill="#FFFFFF"/>
  <circle cx="26" cy="22.5" r="0.6" fill="#FFFFFF"/>
</svg>
